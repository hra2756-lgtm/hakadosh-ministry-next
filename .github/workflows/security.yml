name: Security Checks

on:
  push:
    branches: [main, test]
  pull_request:
    branches: [main, test]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify picomatch mitigation
        run: npm run test:security-patch

      - name: Validate strict audit decisions
        run: npm run test:security-audit

      - name: Validate assistant protections
        run: node --test scripts/assistant.test.mjs scripts/assistant-content.test.mjs

      - name: Run lint
        run: npm run lint

      - name: Run build
        run: npm run build

      - name: Validate contact form protections
        run: node --test scripts/contact.test.mjs

      - name: Validate blog read protections
        run: npm run test:blog

      - name: Validate Bible data and search
        run: npm run test:bible

      - name: Audit dependencies with no advisory exceptions
        run: npm run security:audit

  studio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: studio/package-lock.json
      - run: npm ci
        working-directory: studio
      - name: Validate backup archives
        run: npm run test:backup
      - name: Verify Studio picomatch mitigation
        run: npm run test:security-patch
        working-directory: studio
      - run: npm run build
        working-directory: studio
      - name: Audit Studio dependencies with no advisory exceptions
        run: npm run security:audit
        working-directory: studio
